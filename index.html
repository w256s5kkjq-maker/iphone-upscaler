<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upscaler">
<link rel="manifest" href="./manifest.webmanifest">
<title>Image Upscaler</title>
<style>
:root{--bg:#0f1115;--card:#181c23;--line:#2a3039;--text:#f7f8fb;--muted:#9da5b3;--accent:#87a9ff;--ok:#78d68a;--bad:#ff7b89}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
.app{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:4px 0}.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.pick{display:block;padding:30px 16px;text-align:center;border:1px dashed #465061;border-radius:15px;background:#1d222b}
.pick b{display:block;font-size:18px;margin-bottom:5px}.pick span{font-size:13px;color:var(--muted)}
input[type=file]{display:none}
.preview{position:relative;aspect-ratio:1/1;background:#090b0e;border-radius:15px;overflow:hidden;touch-action:none}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.clip{position:absolute;inset:0;width:50%;overflow:hidden}.clip img{width:100%;height:100%;object-fit:contain}
.line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff}.knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-weight:800}
.labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{width:100%;border:1px solid var(--line);background:#202630;color:var(--text);border-radius:14px;padding:14px;font-size:16px;font-weight:700}
button:disabled{opacity:.55}
button.active,.primary{background:var(--accent);color:#111827;border-color:transparent}.save{background:var(--ok);color:#08220d}
.title{font-size:13px;color:var(--muted);margin:2px 0 9px}.meta,.status{font-size:13px;color:var(--muted);line-height:1.5}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.hidden{display:none}.gap{margin-top:10px}.note{font-size:12px;color:#7f8794;text-align:center}
</style>
</head>
<body>
<main class="app">
<h1>Image Upscaler</h1>
<p class="sub">ออฟไลน์ • ทำงานบน iPhone • รูปไม่ถูกอัปโหลดออกจากเครื่อง</p>

<section class="card">
<label class="pick" for="file"><b>เลือกรูปภาพ</b><span>แตะเพื่อเลือกจาก Photos หรือ Files</span></label>
<input id="file" type="file" accept="image/*">
<div id="meta" class="meta gap"></div>
</section>

<section id="previewCard" class="card hidden">
<div id="preview" class="preview">
<img id="before" alt="">
<div id="clip" class="clip"><img id="after" alt=""></div>
<div id="line" class="line"></div><div id="knob" class="knob">↔</div>
</div>
<div class="labels"><span>ก่อน</span><span>หลัง</span></div>
</section>

<section id="controls" class="card hidden">
<div class="title">ขยายขนาด</div>
<div class="segment">
<button class="scale active" data-v="2">2×</button>
<button class="scale" data-v="3">3×</button>
<button class="scale" data-v="4">4×</button>
</div>
<button id="run" class="primary gap">ขยายรูป</button>
<div id="status" class="status gap"></div>
</section>

<section id="saveCard" class="card hidden">
<button id="save" class="save">บันทึกรูป</button>
<button id="reset" class="gap">เริ่มใหม่</button>
</section>

<div class="note">ไม่มี AI • ไม่มี Server</div>
</main>
<script>
const $=s=>document.querySelector(s);
const file=$('#file'),meta=$('#meta'),previewCard=$('#previewCard'),controls=$('#controls'),saveCard=$('#saveCard');
const before=$('#before'),after=$('#after'),preview=$('#preview'),clip=$('#clip'),line=$('#line'),knob=$('#knob');
const run=$('#run'),save=$('#save'),reset=$('#reset'),status=$('#status');
let image=null,srcUrl=null,outBlob=null,outUrl=null,scale=2,sourceType='image/jpeg';

document.querySelectorAll('.scale').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.scale').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');scale=Number(b.dataset.v);showMeta();
});

function loadImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url})}

file.onchange=async()=>{
 const f=file.files&&file.files[0];if(!f)return;
 cleanupOutput();
 if(srcUrl)URL.revokeObjectURL(srcUrl);
 srcUrl=URL.createObjectURL(f);sourceType=f.type||'image/jpeg';
 try{
   image=await loadImage(srcUrl);
   before.src=srcUrl;after.src=srcUrl;
   previewCard.classList.remove('hidden');controls.classList.remove('hidden');saveCard.classList.add('hidden');
   status.textContent='';status.className='status gap';setSplit(50);showMeta();
 }catch(e){status.textContent='เปิดรูปไม่สำเร็จ ลองเลือกรูป JPG หรือ PNG';status.className='status gap bad'}
};

function showMeta(){
 if(!image)return;
 const w=image.naturalWidth,h=image.naturalHeight,ow=w*scale,oh=h*scale;
 meta.textContent=w.toLocaleString()+' × '+h.toLocaleString()+'  →  '+ow.toLocaleString()+' × '+oh.toLocaleString()+' px';
}
function setSplit(p){p=Math.max(0,Math.min(100,p));clip.style.width=p+'%';line.style.left=p+'%';knob.style.left=p+'%'}
let drag=false;
preview.onpointerdown=e=>{drag=true;preview.setPointerCapture(e.pointerId);move(e)};
preview.onpointermove=e=>{if(drag)move(e)};preview.onpointerup=()=>drag=false;preview.onpointercancel=()=>drag=false;
function move(e){const r=preview.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width*100)}

run.onclick=async()=>{
 if(!image)return;
 run.disabled=true;saveCard.classList.add('hidden');status.textContent='กำลังขยายรูป…';status.className='status gap';
 await new Promise(r=>setTimeout(r,30));
 try{
   const w=image.naturalWidth*scale,h=image.naturalHeight*scale,pixels=w*h;
   if(pixels>24000000)throw new Error('รูปปลายทางใหญ่เกินไปสำหรับการทำงานที่เสถียรบน iPhone ลองลดระดับการขยาย');
   const c=document.createElement('canvas');c.width=w;c.height=h;
   const ctx=c.getContext('2d',{alpha:true});
   if(!ctx)throw new Error('อุปกรณ์นี้สร้าง Canvas ไม่สำเร็จ');
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
   ctx.drawImage(image,0,0,w,h);
   const png=sourceType==='image/png';
   const type=png?'image/png':'image/jpeg';
   outBlob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('สร้างไฟล์ไม่สำเร็จ')),type,png?undefined:0.95));
   if(outUrl)URL.revokeObjectURL(outUrl);
   outUrl=URL.createObjectURL(outBlob);after.src=outUrl;
   status.textContent='เสร็จแล้ว • '+w.toLocaleString()+' × '+h.toLocaleString()+' px • '+(outBlob.size/1024/1024).toFixed(1)+' MB';
   status.className='status gap ok';saveCard.classList.remove('hidden');setSplit(50);
 }catch(e){status.textContent=e.message||'เกิดข้อผิดพลาด';status.className='status gap bad'}
 finally{run.disabled=false}
};

save.onclick=async()=>{
 if(!outBlob)return;
 const ext=outBlob.type==='image/png'?'png':'jpg';
 const f=new File([outBlob],'upscaled-'+scale+'x.'+ext,{type:outBlob.type});
 try{
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Upscaled Image'});return}
 }catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=outUrl;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
};

reset.onclick=()=>{
 cleanupOutput();if(srcUrl)URL.revokeObjectURL(srcUrl);srcUrl=null;image=null;file.value='';meta.textContent='';
 previewCard.classList.add('hidden');controls.classList.add('hidden');saveCard.classList.add('hidden');status.textContent='';
};
function cleanupOutput(){if(outUrl)URL.revokeObjectURL(outUrl);outUrl=null;outBlob=null}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
