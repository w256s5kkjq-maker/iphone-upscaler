<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Upscaler">
<link rel="manifest" href="./manifest.webmanifest">
<title>Image Upscaler</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#111;--sub:#6e6e73;--line:rgba(60,60,67,.16);--blue:#007aff;--green:#34c759;--red:#ff3b30;--glass:rgba(242,242,247,.88)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989d;--line:rgba(84,84,88,.62);--glass:rgba(0,0,0,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
button,input{font:inherit}button{touch-action:manipulation}
.app{max-width:640px;margin:auto;padding:calc(74px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.top{position:fixed;z-index:20;top:0;left:0;right:0;padding-top:env(safe-area-inset-top);height:calc(58px + env(safe-area-inset-top));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line)}
.topin{max-width:640px;height:58px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:17px;font-weight:700}.link{border:0;background:none;color:var(--blue);font-weight:600;padding:10px 0}
.hero{padding:6px 2px 18px}.hero h1{font-size:34px;line-height:1.06;letter-spacing:-1.1px;margin:0 0 8px}.hero p{margin:0;color:var(--sub);font-size:15px;line-height:1.45}
.card{background:var(--card);border:.5px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px}
.pick{display:flex;align-items:center;justify-content:center;min-height:210px;text-align:center;padding:28px}
.pick .icon{width:64px;height:64px;margin:auto auto 12px;border-radius:20px;display:grid;place-items:center;background:rgba(0,122,255,.12);color:var(--blue);font-size:30px}
.pick b{display:block;font-size:20px;margin-bottom:5px}.pick span{color:var(--sub);font-size:13px}
input[type=file]{display:none}
.photo{position:relative;background:#101010;aspect-ratio:1/1;overflow:hidden;touch-action:none}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;transition:transform .18s ease}
.afterclip{position:absolute;inset:0;width:50%;overflow:hidden}
.line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.3)}
.knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.tags{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;pointer-events:none}
.tags span{padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.58);color:#fff;font-size:11px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.info{padding:13px 15px;color:var(--sub);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.scale{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.scale button,.zoom button{border:0;border-radius:14px;min-height:52px;background:rgba(118,118,128,.12);color:var(--text);font-weight:700;font-size:17px}
.scale button.active,.zoom button.active{background:var(--blue);color:#fff}
.sectionlabel{font-size:13px;color:var(--sub);margin:18px 4px 8px}
.zoom{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}
.zoom button{min-height:40px;font-size:14px}
.notice{padding:13px 15px;border-top:.5px solid var(--line);color:var(--sub);font-size:13px;line-height:1.45}
.notice.ok{color:var(--green)}.notice.bad{color:var(--red)}
.progress{height:3px;background:var(--line);overflow:hidden;display:none}.progress div{height:100%;width:0;background:var(--blue);transition:width .15s}
.bottom{position:fixed;z-index:19;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line)}
.bottomin{max-width:608px;margin:auto;display:grid;grid-template-columns:1fr;gap:8px}
.primary{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:17px;font-weight:750}
.primary.save{background:var(--green)}.primary:disabled{opacity:.45}
.secondary{width:100%;min-height:44px;border:0;border-radius:14px;background:rgba(118,118,128,.14);color:var(--blue);font-weight:650}
.hidden{display:none!important}
.spinner{display:inline-block;width:17px;height:17px;border:2px solid rgba(255,255,255,.35);border-top-color:white;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">Upscaler</div><button id="resetTop" class="link hidden">เริ่มใหม่</button></div></header>

<main class="app">
<section class="hero">
<h1 id="headline">ขยายรูป<br>ง่าย ๆ</h1>
<p id="subline">เลือกรูป เลือก 2× หรือ 4× แล้วกดขยาย แค่นั้น</p>
</section>

<label id="pickCard" class="card pick" for="file">
  <div><div class="icon">＋</div><b>เลือกรูปภาพ</b><span>จาก Photos หรือ Files</span></div>
</label>
<input id="file" type="file" accept="image/*">

<section id="editor" class="hidden">
  <div class="card">
    <div id="photo" class="photo">
      <img id="before" alt="">
      <div id="afterClip" class="afterclip hidden"><img id="after" alt=""></div>
      <div id="splitLine" class="line hidden"></div>
      <div id="knob" class="knob hidden">↔</div>
      <div id="tags" class="tags hidden"><span>ก่อน</span><span>หลัง</span></div>
    </div>
    <div class="info"><span id="sourceInfo"></span><label class="link" for="file">เปลี่ยนรูป</label></div>
  </div>

  <div id="choosePanel">
    <div class="sectionlabel">เลือกขนาด</div>
    <div class="card">
      <div class="scale">
        <button class="scaleBtn active" data-scale="2">2×<br><small>แนะนำ</small></button>
        <button class="scaleBtn" data-scale="4">4×<br><small>ใหญ่สุด</small></button>
      </div>
      <div id="targetInfo" class="notice"></div>
      <div id="progress" class="progress"><div id="progressBar"></div></div>
      <div id="status" class="notice">พร้อมขยาย · GPS/EXIF จะถูกลบตอนบันทึก</div>
    </div>
  </div>

  <div id="resultPanel" class="hidden">
    <div class="sectionlabel">ดูความต่าง</div>
    <div class="card">
      <div class="zoom">
        <button class="zoomBtn active" data-zoom="1">พอดี</button>
        <button class="zoomBtn" data-zoom="2">ซูม 2×</button>
        <button class="zoomBtn" data-zoom="3">ซูม 3×</button>
      </div>
      <div id="resultInfo" class="notice ok"></div>
    </div>
  </div>
</section>
</main>

<div id="bottom" class="bottom hidden">
  <div class="bottomin">
    <button id="mainBtn" class="primary">ขยายรูป</button>
    <button id="againBtn" class="secondary hidden">ลองขนาดอื่น</button>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const file=$('#file'),pickCard=$('#pickCard'),editor=$('#editor'),bottom=$('#bottom'),resetTop=$('#resetTop');
const before=$('#before'),after=$('#after'),photo=$('#photo'),afterClip=$('#afterClip'),splitLine=$('#splitLine'),knob=$('#knob'),tags=$('#tags');
const sourceInfo=$('#sourceInfo'),targetInfo=$('#targetInfo'),status=$('#status'),progress=$('#progress'),progressBar=$('#progressBar');
const choosePanel=$('#choosePanel'),resultPanel=$('#resultPanel'),resultInfo=$('#resultInfo'),mainBtn=$('#mainBtn'),againBtn=$('#againBtn');
let img=null,srcUrl=null,outUrl=null,outBlob=null,scale=2,busy=false,zoom=1;
const MAX_PIXELS=18000000,MAX_SIDE=8192;

function fmt(n){return n.toLocaleString()}
function bytes(n){return n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
function load(url){return new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=url})}
function setProgress(v){progress.style.display=(v>0&&v<100)?'block':'none';progressBar.style.width=v+'%'}
function target(){return {w:img?img.naturalWidth*scale:0,h:img?img.naturalHeight*scale:0}}
function safe(){const t=target();return t.w<=MAX_SIDE&&t.h<=MAX_SIDE&&t.w*t.h<=MAX_PIXELS}
function updateTarget(){
 if(!img)return;
 const t=target();
 targetInfo.textContent=fmt(t.w)+' × '+fmt(t.h)+' px';
 if(!safe()){
   targetInfo.textContent+=' · ใหญ่เกินไปสำหรับ iPhone เครื่องนี้';
   targetInfo.className='notice bad';mainBtn.disabled=true;
 }else{targetInfo.className='notice';mainBtn.disabled=busy}
}
function clearOutput(){
 if(outUrl)URL.revokeObjectURL(outUrl);outUrl=null;outBlob=null;after.removeAttribute('src');
 afterClip.classList.add('hidden');splitLine.classList.add('hidden');knob.classList.add('hidden');tags.classList.add('hidden');
 resultPanel.classList.add('hidden');choosePanel.classList.remove('hidden');againBtn.classList.add('hidden');
 mainBtn.textContent='ขยายรูป';mainBtn.classList.remove('save');setZoom(1);
}
async function select(f){
 if(!f)return;clearOutput();if(srcUrl)URL.revokeObjectURL(srcUrl);srcUrl=URL.createObjectURL(f);
 try{
   img=await load(srcUrl);before.src=srcUrl;
   sourceInfo.textContent=fmt(img.naturalWidth)+' × '+fmt(img.naturalHeight)+' px · '+bytes(f.size);
   pickCard.classList.add('hidden');editor.classList.remove('hidden');bottom.classList.remove('hidden');resetTop.classList.remove('hidden');
   scale=2;document.querySelectorAll('.scaleBtn').forEach(b=>b.classList.toggle('active',b.dataset.scale==='2'));
   status.textContent='พร้อมขยาย · GPS/EXIF จะถูกลบตอนบันทึก';status.className='notice';updateTarget();
 }catch(e){status.textContent='เปิดรูปนี้ไม่สำเร็จ ลองใช้ JPG, PNG หรือ WebP';status.className='notice bad'}
}
file.addEventListener('change',()=>select(file.files&&file.files[0]));
document.querySelectorAll('.scaleBtn').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.scaleBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');scale=Number(b.dataset.scale);clearOutput();updateTarget();
});

function canvasBlob(c){return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('สร้างไฟล์ไม่สำเร็จ')),'image/jpeg',.95))}
async function progressiveResize(source,w,h){
 let current=document.createElement('canvas');current.width=source.naturalWidth;current.height=source.naturalHeight;
 let c=current.getContext('2d');c.drawImage(source,0,0);
 let cw=current.width,ch=current.height,step=0;
 while(cw<w||ch<h){
   const nw=Math.min(w,Math.round(cw*1.5)),nh=Math.min(h,Math.round(ch*1.5));
   const next=document.createElement('canvas');next.width=nw;next.height=nh;
   const nx=next.getContext('2d');nx.imageSmoothingEnabled=true;nx.imageSmoothingQuality='high';nx.drawImage(current,0,0,nw,nh);
   current.width=1;current.height=1;current=next;cw=nw;ch=nh;step++;
   setProgress(Math.min(64,18+step*14));await new Promise(r=>setTimeout(r,0));
 }
 return current;
}
async function mildSharpen(canvas){
 const w=canvas.width,h=canvas.height;
 if(w*h>12000000)return;
 const ctx=canvas.getContext('2d',{willReadFrequently:true}),strip=180,str=.10;
 for(let y=0;y<h;y+=strip){
   const sy=Math.max(0,y-1),eh=Math.min(h,y+strip+1),hh=eh-sy;
   const im=ctx.getImageData(0,sy,w,hh),src=new Uint8ClampedArray(im.data);
   const from=Math.max(1,y-sy),to=Math.min(hh-1,from+Math.min(strip,h-y));
   for(let yy=from;yy<to;yy++)for(let x=1;x<w-1;x++){
     const i=(yy*w+x)*4;
     for(let k=0;k<3;k++){
       const v=src[i+k]*(1+4*str)-str*(src[i-4+k]+src[i+4+k]+src[i-w*4+k]+src[i+w*4+k]);
       im.data[i+k]=v<0?0:v>255?255:v;
     }
   }
   ctx.putImageData(im,0,sy,0,from,w,to-from);
   if(y%(strip*5)===0){setProgress(68+Math.round(y/h*18));await new Promise(r=>setTimeout(r,0))}
 }
}
async function process(){
 if(!img||busy||!safe())return;
 busy=true;mainBtn.disabled=true;mainBtn.innerHTML='<span class="spinner"></span>กำลังขยาย';status.textContent='กำลังประมวลผลบน iPhone…';status.className='notice';setProgress(10);
 try{
   const t=target(),canvas=await progressiveResize(img,t.w,t.h);
   await mildSharpen(canvas);setProgress(90);
   outBlob=await canvasBlob(canvas);canvas.width=1;canvas.height=1;
   if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(outBlob);after.src=outUrl;
   afterClip.classList.remove('hidden');splitLine.classList.remove('hidden');knob.classList.remove('hidden');tags.classList.remove('hidden');setSplit(50);
   choosePanel.classList.add('hidden');resultPanel.classList.remove('hidden');againBtn.classList.remove('hidden');
   resultInfo.textContent='ผลลัพธ์ '+fmt(t.w)+' × '+fmt(t.h)+' px · '+bytes(outBlob.size)+' · GPS/EXIF ถูกลบ';
   mainBtn.textContent='บันทึกรูป';mainBtn.classList.add('save');status.textContent='เสร็จแล้ว';setProgress(100);
 }catch(e){status.textContent=e.message||'ประมวลผลไม่สำเร็จ';status.className='notice bad';clearOutput()}
 finally{busy=false;mainBtn.disabled=false}
}
async function save(){
 if(!outBlob)return;
 const f=new File([outBlob],'upscaled-'+scale+'x.jpg',{type:'image/jpeg'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Upscaled Image'});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=outUrl;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
}
mainBtn.onclick=()=>outBlob?save():process();
againBtn.onclick=()=>{clearOutput();updateTarget();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};

let drag=false;
function setSplit(p){p=Math.max(0,Math.min(100,p));afterClip.style.width=p+'%';splitLine.style.left=p+'%';knob.style.left=p+'%'}
function move(e){const r=photo.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width*100)}
photo.onpointerdown=e=>{if(!outBlob)return;drag=true;photo.setPointerCapture(e.pointerId);move(e)};
photo.onpointermove=e=>{if(drag)move(e)};photo.onpointerup=()=>drag=false;photo.onpointercancel=()=>drag=false;

function setZoom(z){
 zoom=z;before.style.transform='scale('+z+')';after.style.transform='scale('+z+')';
 document.querySelectorAll('.zoomBtn').forEach(b=>b.classList.toggle('active',Number(b.dataset.zoom)===z));
}
document.querySelectorAll('.zoomBtn').forEach(b=>b.onclick=()=>setZoom(Number(b.dataset.zoom)));

function reset(){
 clearOutput();if(srcUrl)URL.revokeObjectURL(srcUrl);srcUrl=null;img=null;file.value='';
 editor.classList.add('hidden');pickCard.classList.remove('hidden');bottom.classList.add('hidden');resetTop.classList.add('hidden');
}
resetTop.onclick=reset;

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
